<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>국어 어휘 노트</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --text: #1f2430;
    --muted: #6b7280;
    --line: #e2e5ea;
    --primary: #2f6fed;
    --primary-dark: #2258c4;
    --primary-soft: #eaf1ff;
    --danger: #d64545;
    --mark: #fff1a8;
    --star: #f0a020;
    --pos-명: #2f8f5b;
    --pos-동: #2f6fed;
    --pos-형: #c2410c;
    --pos-부: #7a4fd6;
    --pos-기타: #6b7280;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    font-size: 17px;
    line-height: 1.55;
  }
  header {
    background: var(--card);
    border-bottom: 1px solid var(--line);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  header h1 { margin: 0; font-size: 26px; }
  header h1 small { color: var(--muted); font-size: 16px; font-weight: normal; margin-left: 8px; }
  .header-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  main { max-width: 1000px; margin: 20px auto 60px; padding: 0 16px; }

  input, select, button, textarea { font: inherit; color: inherit; }
  input[type="text"], input[type="search"], input[type="date"], select, textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #c9ced6;
    border-radius: 8px;
    background: #fff;
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--primary); outline-offset: 1px; }
  button {
    padding: 9px 16px;
    border-radius: 8px;
    border: 1px solid #c9ced6;
    background: #fff;
    cursor: pointer;
    white-space: nowrap;
  }
  button:hover { background: #f0f2f5; }
  button.primary { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: bold; }
  button.primary:hover { background: var(--primary-dark); }
  button.small { padding: 3px 10px; font-size: 14px; }
  button.danger { color: var(--danger); }

  /* 검색·필터 */
  .toolbar {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px 18px;
    position: sticky;
    top: 0;
    z-index: 5;
    box-shadow: 0 2px 6px rgba(0,0,0,.04);
  }
  .search-wrap { position: relative; }
  .search-wrap input { font-size: 19px; padding: 12px 14px 12px 44px; }
  .search-wrap::before {
    content: "🔍"; position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 18px; opacity: .6;
  }
  .search-hint { color: var(--muted); font-size: 14px; margin: 6px 2px 0; }
  .filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    padding: 5px 12px; border-radius: 999px; font-size: 15px;
    border: 1px solid #c9ced6; background: #fff;
  }
  .chip.on { background: var(--primary); border-color: var(--primary); color: #fff; }
  .filters select { width: auto; padding: 6px 10px; font-size: 15px; }
  .toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 15px; cursor: pointer; user-select: none; }
  .toggle input { width: 18px; height: 18px; }

  .result-info { color: var(--muted); margin: 16px 4px 8px; font-size: 15px; }

  /* 단어 목록 */
  .day { margin-top: 18px; }
  .day h2 {
    font-size: 18px; margin: 0 0 8px 4px; display: flex; gap: 8px; align-items: baseline;
  }
  .day h2 span { color: var(--muted); font-weight: normal; font-size: 14px; }
  .words { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
  .word {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .word.star { border-color: var(--star); box-shadow: inset 4px 0 0 var(--star); }
  .word-head { display: flex; align-items: center; gap: 8px; }
  .pos {
    flex: none; width: 26px; height: 26px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: bold; color: #fff;
  }
  .word-title { font-size: 21px; font-weight: bold; }
  .hanja { color: var(--muted); font-size: 16px; }
  .star-btn { margin-left: auto; border: none; background: none; font-size: 20px; padding: 0 4px; color: #c9ced6; }
  .star-btn.on { color: var(--star); }
  .star-btn:hover { background: none; }
  .meaning { white-space: pre-line; }
  .meaning.empty { color: var(--muted); font-style: italic; }
  .meaning.hidden {
    background: #eef0f3; color: transparent; border-radius: 6px; cursor: pointer; user-select: none;
    position: relative; min-height: 1.55em;
  }
  .meaning.hidden::after {
    content: "눌러서 뜻 보기"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 14px;
  }
  .rel { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 14px; }
  .rel b { color: var(--muted); font-weight: normal; margin-right: 2px; }
  .rel button { padding: 1px 8px; font-size: 14px; border-radius: 999px; background: var(--primary-soft); border-color: transparent; color: var(--primary-dark); }
  .rel.ant button { background: #fdecec; color: var(--danger); }
  .note { color: var(--muted); font-size: 14px; }
  .word-foot { display: flex; gap: 6px; justify-content: flex-end; margin-top: 2px; }
  mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }
  .empty-state { text-align: center; color: var(--muted); padding: 48px 12px; }

  /* 입력 창 */
  dialog {
    border: none; border-radius: 14px; padding: 0; width: min(560px, calc(100vw - 32px));
    box-shadow: 0 10px 40px rgba(0,0,0,.25);
  }
  dialog::backdrop { background: rgba(20,24,32,.45); }
  dialog form { padding: 20px 22px; }
  dialog h2 { margin: 0 0 6px; font-size: 22px; }
  label { display: block; font-weight: bold; margin: 12px 0 5px; font-size: 15px; }
  label small { font-weight: normal; color: var(--muted); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  textarea { resize: vertical; min-height: 70px; }
  .lookup { margin-top: 14px; padding: 10px 12px; border-radius: 10px; background: var(--primary-soft); }
  .lookup-title { font-weight: bold; font-size: 15px; }
  .lookup-title small { font-weight: normal; color: var(--muted); margin-left: 4px; }
  .lookup-links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .lookup-links a {
    padding: 5px 12px; border-radius: 999px; font-size: 14px; text-decoration: none;
    background: #fff; border: 1px solid #c9d8f7; color: var(--primary-dark);
  }
  .lookup-links a:hover { background: var(--primary); color: #fff; }
  .lookup.off .lookup-links a { pointer-events: none; opacity: .45; }
  .lookup-hint { margin: 6px 0 0; font-size: 13px; color: var(--muted); }
  .form-buttons { display: flex; gap: 8px; margin-top: 18px; }
  .form-buttons .primary { flex: 1; }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: #1f2430; color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 15px;
    opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  .toast.show { opacity: 1; }

  /* 한자 풀이 */
  .hj { cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px; }
  .hj:hover { color: var(--primary-dark); }
  .hj-pop {
    position: absolute; z-index: 20; display: none;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 6px 24px rgba(0,0,0,.15); padding: 8px 10px; min-width: 200px; max-width: 300px;
  }
  .hj-pop.show { display: block; }
  .hj-row { display: flex; align-items: center; gap: 12px; padding: 4px 6px; border-radius: 6px; }
  .hj-row.cur { background: var(--primary-soft); }
  .hj-char { font-size: 32px; line-height: 1.2; width: 40px; text-align: center; font-family: "Batang", "바탕", "Noto Serif KR", serif; }
  .hj-hun { font-size: 17px; }
  .hj-hun b { font-size: 19px; }
  .hj-hun a { font-size: 13px; color: var(--muted); }

  @media (max-width: 600px) {
    header { padding: 12px 16px; }
    header h1 { font-size: 22px; }
    .words { grid-template-columns: 1fr; }
    .grid2 { grid-template-columns: 1fr; }
  }
  @media print {
    header .header-actions, .toolbar, .word-foot, .star-btn, .hj-pop { display: none !important; }
    body { background: #fff; }
    .word { break-inside: avoid; }
  }
</style>
</head>
<body>

<header>
  <h1>📒 국어 어휘 노트 <small id="totalCount"></small></h1>
  <div class="header-actions">
    <button class="primary" id="addBtn">＋ 단어 추가</button>
    <button id="exportBtn" title="단어장을 파일로 저장합니다">내보내기</button>
    <button id="importBtn" title="저장해 둔 파일에서 단어장을 불러옵니다">불러오기</button>
    <input type="file" id="importFile" accept=".json,application/json" hidden>
  </div>
</header>

<main>
  <section class="toolbar">
    <div class="search-wrap">
      <input type="search" id="q" placeholder="단어, 뜻, 유의어, 한자로 검색" autocomplete="off">
    </div>
    <p class="search-hint">초성으로도 찾을 수 있어요. 예: <b>ㅍㄹㅎㄷ</b> → 파리하다 · 밑줄 친 <b>한자</b>를 누르면 글자마다 음과 뜻이 보여요.</p>
    <div class="filters">
      <div class="chips" id="posChips"></div>
      <select id="dateFilter" aria-label="날짜 선택"></select>
      <select id="sort" aria-label="정렬">
        <option value="date">날짜순</option>
        <option value="abc">가나다순</option>
      </select>
      <label class="toggle"><input type="checkbox" id="hideMeaning"> 뜻 가리기</label>
      <label class="toggle"><input type="checkbox" id="starOnly"> ★ 헷갈리는 단어만</label>
      <label class="toggle"><input type="checkbox" id="blankOnly"> 뜻 미입력만</label>
    </div>
  </section>

  <p class="result-info" id="resultInfo"></p>
  <div id="list"></div>
</main>

<dialog id="editDialog">
  <form method="dialog" id="editForm">
    <h2 id="dialogTitle">단어 추가</h2>
    <div class="grid2">
      <div>
        <label for="fWord">단어</label>
        <input type="text" id="fWord" required>
      </div>
      <div>
        <label for="fHanja">한자 <small>(선택)</small></label>
        <input type="text" id="fHanja" placeholder="예: 至樂">
      </div>
      <div>
        <label for="fPos">품사</label>
        <select id="fPos">
          <option value="명">명사</option>
          <option value="동">동사</option>
          <option value="형">형용사</option>
          <option value="부">부사</option>
          <option value="기타">기타</option>
        </select>
      </div>
      <div>
        <label for="fDate">공부한 날</label>
        <input type="date" id="fDate" required>
      </div>
    </div>
    <div class="lookup" id="lookup">
      <div class="lookup-title">🔎 뜻 찾아보기 <small id="lookupWord">단어를 먼저 입력하세요</small></div>
      <div class="lookup-links">
        <a data-dict="std" target="_blank" rel="noopener">표준국어대사전</a>
        <a data-dict="open" target="_blank" rel="noopener">우리말샘</a>
        <a data-dict="naver" target="_blank" rel="noopener">네이버 국어사전</a>
        <a data-dict="hanja" target="_blank" rel="noopener">한자사전</a>
      </div>
      <p class="lookup-hint">새 창에서 사전이 열려요. 뜻을 복사해 아래 칸에 붙여 넣으세요. 한자어라면 한자 칸도 채워 주세요.</p>
    </div>
    <label for="fMeaning">뜻 <small>(여러 뜻은 줄을 바꿔 적기)</small></label>
    <textarea id="fMeaning"></textarea>
    <div class="grid2">
      <div>
        <label for="fSyn">유의어 <small>(쉼표로 구분)</small></label>
        <input type="text" id="fSyn">
      </div>
      <div>
        <label for="fAnt">반의어 <small>(쉼표로 구분)</small></label>
        <input type="text" id="fAnt">
      </div>
    </div>
    <label for="fNote">메모 <small>(선택)</small></label>
    <input type="text" id="fNote">
    <div class="form-buttons">
      <button type="button" id="cancelBtn">취소</button>
      <button type="submit" class="primary" id="saveBtn">저장</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast"></div>
<div class="hj-pop" id="hjPop" role="dialog" aria-label="한자 풀이"></div>

const splitList = s => (s || '').split(',').map(x => x.trim()).filter(Boolean);

function seedWords() {
  return SEED.map(([date, pos, word, hanja, meaning, syn, ant, note], i) => ({
    id: 'w' + (i + 1), date, pos, word, hanja, meaning,
    syn: splitList(syn), ant: splitList(ant), note, star: false,
  }));
}

const SEEN_KEY = 'vocab-note-seen-v1';
const FIRST_SEED_COUNT = 64; // 새 단어 자동 추가 기능 이전에 배포된 기본 단어 수 (w1~w64)
let newWordCount = 0;
let words = load();
let state = { q: '', pos: '전체', date: '', sort: 'date', hide: false, starOnly: false, blankOnly: false };
const revealed = new Set();

function load() {
  let result = null;
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (Array.isArray(saved)) result = addNewSeedWords(fillBlanks(saved));
  } catch (e) { /* 저장된 자료가 없거나 읽을 수 없음 */ }
  if (!result) result = seedWords();
  markSeedSeen();
  return result;
}

// 이 기기에서 이미 받은 기본 단어 번호. 한 번 받은 단어는 삭제해도 다시 넣지 않음.
function getSeen() {
  try {
    const seen = JSON.parse(localStorage.getItem(SEEN_KEY));
    if (Array.isArray(seen)) return new Set(seen);
  } catch (e) { /* 처음이거나 읽을 수 없음 */ }
  return new Set(Array.from({ length: FIRST_SEED_COUNT }, (_, i) => 'w' + (i + 1)));
}
function markSeedSeen() {
  try { localStorage.setItem(SEEN_KEY, JSON.stringify(seedWords().map(w => w.id))); } catch (e) { /* 무시 */ }
}
// 나중에 추가된 기본 단어를 저장된 단어장에 넣음
function addNewSeedWords(saved) {
  const seen = getSeen();
  const have = new Set(saved.map(w => w.id));
  const fresh = seedWords().filter(w => !seen.has(w.id) && !have.has(w.id));
  newWordCount = fresh.length;
  if (fresh.length) {
    saved.push(...fresh);
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(saved)); } catch (e) { /* 무시 */ }
  }
  return saved;
}
// 노트를 잘못 읽었던 단어: 예전 이름 → 바른 이름
const RENAMED = { '자자하다': '짜짜하다' };

// 예전에 뜻 없이 저장된 기본 단어는 새 기본 자료의 뜻으로 채움 (직접 적은 뜻은 그대로 둠)
function fillBlanks(saved) {
  const seed = Object.fromEntries(seedWords().map(w => [w.id, w]));
  saved.forEach(w => {
    const s = seed[w.id];
    if (s && RENAMED[w.word] === s.word) {
      Object.assign(w, { word: s.word, pos: s.pos, hanja: s.hanja, meaning: s.meaning, syn: s.syn, ant: s.ant, note: s.note });
      return;
    }
    if (!s || s.word !== w.word) return;
    // 나중에 넣은 한자도 비어 있으면 채움
    if (!w.hanja && s.hanja) w.hanja = s.hanja;
    if (w.ant && w.ant.join() === '연화(부드러워짐)') { w.ant = s.ant; w.note = w.note || s.note; }
    if ((w.meaning || '').trim() || !s.meaning) return;
    Object.assign(w, {
      pos: s.pos, meaning: s.meaning,
      hanja: w.hanja || s.hanja,
      syn: (w.syn || []).length ? w.syn : s.syn,
      ant: (w.ant || []).length ? w.ant : s.ant,
      note: w.note && w.note !== s.note.split(' · ')[0] ? w.note : s.note,
    });
  });
  return saved;
}
function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(words)); }
  catch (e) { toast('브라우저에 저장하지 못했어요. 내보내기로 백업해 주세요.'); }
}

// ---------- 검색 ----------
const CHO = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
function toChosung(str) {
  let out = '';
  for (const ch of str) {
    const code = ch.charCodeAt(0) - 0xAC00;
    out += (code >= 0 && code < 11172) ? CHO[Math.floor(code / 588)] : ch;
  }
  return out;
}
const isChosungOnly = s => /^[ㄱ-ㅎ\s]+$/.test(s);
const norm = s => (s || '').toLowerCase().replace(/\s+/g, '');

function matches(w, q) {
  if (!q) return true;
  const nq = norm(q);
  if (isChosungOnly(q)) {
    return [w.word, ...w.syn, ...w.ant].some(t => norm(toChosung(t)).includes(nq));
  }
  const hay = [w.word, w.hanja, w.meaning, w.note, ...w.syn, ...w.ant].map(norm).join('\n');
  return hay.includes(nq);
}

// 검색어를 노란색으로 표시 (띄어쓰기 무시)
function highlight(text, q) {
  const safe = escapeHtml(text || '');
  if (!q || isChosungOnly(q)) return safe;
  const chars = [...norm(q)].map(c => c.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  if (!chars.length) return safe;
  try {
    const re = new RegExp('(' + chars.join('\\s*') + ')', 'gi');
    return safe.replace(re, '<mark>$1</mark>');
  } catch (e) { return safe; }
}
function highlightWord(w, q) {
  if (q && isChosungOnly(q)) {
    // 초성 검색일 때는 단어 전체를 표시
    return norm(toChosung(w.word)).includes(norm(q)) ? `<mark>${escapeHtml(w.word)}</mark>` : escapeHtml(w.word);
  }
  return highlight(w.word, q);
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// ---------- 화면 그리기 ----------
const $ = id => document.getElementById(id);

function formatDate(d) {
  const dt = new Date(d + 'T00:00:00');
  if (isNaN(dt)) return d;
  return `${dt.getMonth() + 1}/${dt.getDate()} (${DAYS[dt.getDay()]})`;
}

function renderFilters() {
  const counts = {};
  words.forEach(w => counts[w.pos] = (counts[w.pos] || 0) + 1);
  const opts = ['전체', '명', '동', '형', '부', '기타'].filter(p => p === '전체' || counts[p]);
  $('posChips').innerHTML = opts.map(p =>
    `<button class="chip ${state.pos === p ? 'on' : ''}" data-pos="${p}">${p === '전체' ? '전체' : POS_NAME[p]}</button>`
  ).join('');

  const dates = [...new Set(words.map(w => w.date))].sort();
  if (state.date && !dates.includes(state.date)) state.date = '';
  $('dateFilter').innerHTML = `<option value="">모든 날짜</option>` +
    dates.map(d => `<option value="${d}" ${d === state.date ? 'selected' : ''}>${formatDate(d)} · ${words.filter(w => w.date === d).length}개</option>`).join('');
  $('totalCount').textContent = `단어 ${words.length}개`;
}

function render() {
  const q = state.q.trim();
  let list = words.filter(w =>
    (state.pos === '전체' || w.pos === state.pos) &&
    (!state.date || w.date === state.date) &&
    (!state.starOnly || w.star) &&
    (!state.blankOnly || !w.meaning.trim()) &&
    matches(w, q)
  );

  const byWord = (a, b) => a.word.replace(/^~/, '').localeCompare(b.word.replace(/^~/, ''), 'ko');
  list.sort(state.sort === 'abc' ? byWord : (a, b) => a.date.localeCompare(b.date) || 0);

  const blank = words.filter(w => !w.meaning.trim()).length;
  $('resultInfo').textContent = (q ? `‘${q}’ 검색 결과 ${list.length}개` : `${list.length}개 표시 중`) +
    (blank ? ` · 뜻을 아직 적지 않은 단어 ${blank}개` : '');

  if (!list.length) {
    $('list').innerHTML = `<div class="empty-state">${q ? '찾는 단어가 없어요.<br>철자를 확인하거나 <b>＋ 단어 추가</b>로 새로 넣어 보세요.' : '조건에 맞는 단어가 없어요.'}</div>`;
    return;
  }

  if (state.sort === 'abc') {
    $('list').innerHTML = `<div class="words">${list.map(w => card(w, q)).join('')}</div>`;
  } else {
    const groups = {};
    list.forEach(w => (groups[w.date] = groups[w.date] || []).push(w));
    $('list').innerHTML = Object.keys(groups).sort().map(d => `
      <section class="day">
        <h2>${formatDate(d)} <span>${groups[d].length}개</span></h2>
        <div class="words">${groups[d].map(w => card(w, q)).join('')}</div>
      </section>`).join('');
  }
}

function card(w, q) {
  const color = `var(--pos-${w.pos in POS_NAME ? w.pos : '기타'})`;
  const hidden = state.hide && !revealed.has(w.id) && w.meaning.trim();
  const meaning = w.meaning.trim()
    ? `<div class="meaning ${hidden ? 'hidden' : ''}" data-reveal="${w.id}">${highlight(w.meaning, q)}</div>`
    : `<div class="meaning empty">뜻을 아직 적지 않았어요</div>`;
  const rel = (label, items, cls) => items.length
    ? `<div class="rel ${cls}"><b>${label}</b>${items.map(t => `<button data-search="${escapeHtml(t.replace(/\(.*\)/, ''))}" title="‘${escapeHtml(t)}’ 검색">${hanjaify(highlight(t, q))}</button>`).join('')}</div>`
    : '';
  return `
    <article class="word ${w.star ? 'star' : ''}">
      <div class="word-head">
        <span class="pos" style="background:${color}" title="${POS_NAME[w.pos] || w.pos}">${w.pos === '기타' ? '·' : w.pos}</span>
        <span class="word-title">${highlightWord(w, q)}</span>
        ${w.hanja ? `<span class="hanja">(${hanjaify(highlight(w.hanja, q))})</span>` : ''}
        <button class="star-btn ${w.star ? 'on' : ''}" data-star="${w.id}" title="헷갈리는 단어로 표시">★</button>
      </div>
      ${meaning}
      ${hidden ? '' : rel('유의어', w.syn, '') + rel('반의어', w.ant, 'ant')}
      ${w.note && !hidden ? `<div class="note">📝 ${hanjaify(highlight(w.note, q))}</div>` : ''}
      <div class="word-foot">
        <button class="small" data-edit="${w.id}">${w.meaning.trim() ? '수정' : '뜻 적기'}</button>
        <button class="small danger" data-del="${w.id}">삭제</button>
      </div>
    </article>`;
}

function refresh() { renderFilters(); render(); }

// ---------- 이벤트 ----------
$('q').addEventListener('input', e => { state.q = e.target.value; render(); });
$('posChips').addEventListener('click', e => {
  const b = e.target.closest('[data-pos]'); if (!b) return;
  state.pos = b.dataset.pos; refresh();
});
$('dateFilter').addEventListener('change', e => { state.date = e.target.value; render(); });
$('sort').addEventListener('change', e => { state.sort = e.target.value; render(); });
$('hideMeaning').addEventListener('change', e => { state.hide = e.target.checked; revealed.clear(); render(); });
$('starOnly').addEventListener('change', e => { state.starOnly = e.target.checked; render(); });
$('blankOnly').addEventListener('change', e => { state.blankOnly = e.target.checked; render(); });

$('list').addEventListener('click', e => {
  if (e.target.closest('.hj')) return; // 한자 풀이는 아래에서 따로 처리
  const t = e.target.closest('[data-star],[data-edit],[data-del],[data-reveal],[data-search]');
  if (!t) return;
  if (t.dataset.star) {
    const w = words.find(x => x.id === t.dataset.star); w.star = !w.star; save(); render();
  } else if (t.dataset.edit) {
    openEditor(words.find(x => x.id === t.dataset.edit));
  } else if (t.dataset.del) {
    const w = words.find(x => x.id === t.dataset.del);
    if (confirm(`‘${w.word}’ 단어를 삭제할까요?`)) {
      words = words.filter(x => x.id !== w.id); save(); refresh(); toast('삭제했어요.');
    }
  } else if (t.dataset.reveal && t.classList.contains('hidden')) {
    revealed.add(t.dataset.reveal); render();
  } else if (t.dataset.search) {
    $('q').value = state.q = t.dataset.search; render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
});

// 단어 추가·수정
let editingId = null;
function openEditor(w) {
  editingId = w ? w.id : null;
  $('dialogTitle').textContent = w ? `‘${w.word}’ 수정` : '단어 추가';
  $('fWord').value = w ? w.word : '';
  $('fHanja').value = w ? w.hanja : '';
  $('fPos').value = w ? w.pos : '명';
  $('fDate').value = w ? w.date : today();
  $('fMeaning').value = w ? w.meaning : '';
  $('fSyn').value = w ? w.syn.join(', ') : '';
  $('fAnt').value = w ? w.ant.join(', ') : '';
  $('fNote').value = w ? w.note : '';
  updateLookup();
  $('editDialog').showModal();
  (w && !w.meaning ? $('fMeaning') : $('fWord')).focus();
}

// 입력한 단어로 사전 검색 주소를 만듦 (‘~에 준하다’ → ‘준하다’)
const DICT_URL = {
  std: q => `https://stdict.korean.go.kr/search/searchResult.do?searchKeyword=${q}`,
  open: q => `https://opendict.korean.go.kr/search/searchResult?query=${q}`,
  naver: q => `https://ko.dict.naver.com/#/search?query=${q}`,
  hanja: q => `https://hanja.dict.naver.com/#/search?query=${q}`,
};
function updateLookup() {
  const word = $('fWord').value.trim().replace(/^~\S*\s+/, '').replace(/^~/, '');
  const hanja = $('fHanja').value.trim().split(/[\s/]/)[0];
  $('lookup').classList.toggle('off', !word);
  $('lookupWord').textContent = word ? `‘${word}’` : '단어를 먼저 입력하세요';
  document.querySelectorAll('#lookup [data-dict]').forEach(a => {
    const q = encodeURIComponent(a.dataset.dict === 'hanja' && hanja ? hanja : word);
    a.href = word ? DICT_URL[a.dataset.dict](q) : '#';
  });
}
$('fWord').addEventListener('input', updateLookup);
$('fHanja').addEventListener('input', updateLookup);
$('addBtn').addEventListener('click', () => openEditor(null));
$('cancelBtn').addEventListener('click', () => $('editDialog').close());
$('editForm').addEventListener('submit', e => {
  e.preventDefault();
  const data = {
    word: $('fWord').value.trim(),
    hanja: $('fHanja').value.trim(),
    pos: $('fPos').value,
    date: $('fDate').value,
    meaning: $('fMeaning').value.trim(),
    syn: splitList($('fSyn').value.replace(/、|，/g, ',')),
    ant: splitList($('fAnt').value.replace(/、|，/g, ',')),
    note: $('fNote').value.trim(),
  };
  if (!data.word || !data.date) return;
  if (editingId) {
    Object.assign(words.find(x => x.id === editingId), data);
    toast('수정했어요.');
  } else {
    const dup = words.find(x => x.word === data.word);
    if (dup && !confirm(`‘${data.word}’는 ${formatDate(dup.date)}에 이미 있어요. 그래도 추가할까요?`)) return;
    words.push({ id: 'w' + Date.now(), star: false, ...data });
    toast('추가했어요.');
  }
  save(); refresh(); $('editDialog').close();
});

// 내보내기·불러오기
$('exportBtn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(words, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `어휘노트_${today()}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
});
$('importBtn').addEventListener('click', () => $('importFile').click());
$('importFile').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = '';
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (!Array.isArray(data) || !data.every(w => w && w.word && w.date)) throw new Error();
    if (!confirm(`단어 ${data.length}개를 불러와 지금 단어장을 바꿀까요?`)) return;
    words = data.map(w => ({ hanja: '', meaning: '', note: '', pos: '기타', star: false, ...w,
      syn: Array.isArray(w.syn) ? w.syn : [], ant: Array.isArray(w.ant) ? w.ant : [] }));
    save(); refresh(); toast('불러왔어요.');
  } catch (err) { alert('어휘 노트 파일이 아니거나 내용이 손상되었어요.'); }
});

// ---------- 한자 풀이 ----------
// 글자: 훈(뜻) 음
const HANJA = Object.fromEntries(`
至:이를 지|樂:즐길 락|逍:노닐 소|遙:멀 요|吟:읊을 음|詠:읊을 영|落:떨어질 락|紅:붉을 홍|
功:공 공|名:이름 명|詩:시 시|書:글 서|假:거짓 가|裝:꾸밀 장|遊:놀 유|民:백성 민|閑:한가할 한|
豪:호걸 호|宕:호탕할 탕|北:북녘 북|闕:대궐 궐|修:닦을 수|身:몸 신|準:준할 준|結:맺을 결|付:줄 부|
臨:임할 림|時:때 시|變:변할 변|通:통할 통|傷:다칠 상|心:마음 심|漂:떠다닐 표|泊:머무를 박|
飢:주릴 기|渴:목마를 갈|墓:무덤 묘|所:바 소|薄:엷을 박|命:목숨 명|美:아름다울 미|人:사람 인|
私:사사 사|安:편안 안|存:있을 존|沈:잠길 침|澱:앙금 전|刷:인쇄할 쇄|新:새 신|決:결단할 결|
然:그럴 연|太:클 태|后:왕후 후|生:날 생|小:작을 소|蘇:되살아날 소|自:스스로 자|若:같을 약|
泰:클 태|糾:살필 규|察:살필 찰|泛:뜰 범|陞:오를 승|品:품계 품|懷:품을 회|抱:안을 포|
無:없을 무|二:두 이|大:큰 대|喜:기쁠 희|驚:놀랄 경|失:잃을 실|色:빛 색|思:생각 사|索:찾을 색|死:죽을 사|
例:법식 례|事:일 사|隱:숨을 은|襤:누더기 람|褸:헌 누더기 루|辱:욕될 욕|問:물을 문|候:물을 후|
畢:마칠 필|竟:마침내 경|硬:굳을 경|化:될 화|軟:연할 연|孟:맏 맹|浪:물결 랑|稱:일컬을 칭|謝:사례할 사|
厚:두터울 후|待:대접할 대|可:옳을 가|當:마땅 당|明:밝을 명|朗:밝을 랑|責:꾸짖을 책|望:바랄 망|
篤:도타울 독|志:뜻 지|家:집 가|意:뜻 의|玲:옥소리 령|瓏:옥소리 롱|謙:겸손할 겸|讓:사양할 양|
照:비칠 조|應:응할 응|行:다닐 행|怪:괴이할 괴|異:다를 이
`.replace(/\n/g, '').split('|').map(s => s.split(':')));

const HANJA_RUN = /[㐀-鿿豈-﫿]+/g;
// 이어진 한자 묶음마다 누를 수 있게 감쌈 (태그 이름·속성에는 한자가 없으므로 안전)
function hanjaify(html) {
  return html.replace(HANJA_RUN, run =>
    `<span class="hj" data-hj="${run}">${[...run].map((c, i) => `<span data-i="${i}">${c}</span>`).join('')}</span>`);
}

function showHanja(el, cur) {
  const pop = $('hjPop');
  pop.innerHTML = [...el.dataset.hj].map((c, i) => {
    const info = HANJA[c];
    const [hun, eum] = info ? [info.slice(0, info.lastIndexOf(' ')), info.slice(info.lastIndexOf(' ') + 1)] : [];
    const link = `<a href="https://hanja.dict.naver.com/#/search?query=${encodeURIComponent(c)}" target="_blank" rel="noopener">사전</a>`;
    return `<div class="hj-row ${i === cur ? 'cur' : ''}">
      <span class="hj-char">${c}</span>
      <span class="hj-hun">${info ? `${hun} <b>${eum}</b> ${link}` : `풀이 없음 ${link}`}</span>
    </div>`;
  }).join('');
  pop.classList.add('show');
  const r = el.getBoundingClientRect();
  const w = pop.offsetWidth;
  const left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - w - 8));
  pop.style.left = left + 'px';
  pop.style.top = (r.bottom + window.scrollY + 6) + 'px';
}
function hideHanja() { $('hjPop').classList.remove('show'); }

document.addEventListener('click', e => {
  const el = e.target.closest('.hj');
  if (el) {
    e.preventDefault();
    const i = e.target.dataset.i;
    showHanja(el, i === undefined ? -1 : Number(i));
  } else if (!e.target.closest('#hjPop')) {
    hideHanja();
  }
});
window.addEventListener('resize', hideHanja);

// 단축키: / 를 누르면 검색창으로
document.addEventListener('keydown', e => {
  if (e.key === '/' && !['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) {
    e.preventDefault(); $('q').focus();
  }
  if (e.key === 'Escape' && $('hjPop').classList.contains('show')) {
    hideHanja(); return;
  }
  if (e.key === 'Escape' && document.activeElement === $('q') && state.q) {
    $('q').value = state.q = ''; render();
  }
});

function today() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

let toastTimer;
function toast(msg) {
  $('toast').textContent = msg; $('toast').classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => $('toast').classList.remove('show'), 1800);
}

refresh();
if (newWordCount) toast(`새 단어 ${newWordCount}개가 추가됐어요.`);
</script>
